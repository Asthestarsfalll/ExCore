[project]
name = "excore"
version = "0.1.1b1"
description = "Build your own development toolkit efficiently."
authors = [{ name = "Asthestarsfalll", email = "1186454801@qq.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development",
  "Typing :: Typed",
  "Topic :: Utilities",
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "loguru >=0.7.2,<0.8.0",
  "requests ==2.28.1",
  "toml ==0.10.2",
  "tabulate",
  "tqdm",
  "rich",
  "astor",
  "typer >=0.13.1,<0.14.0",
  "filelock >=3.15.4,<3.16.0",
]

[project.scripts]
excore = "excore.cli.launch:app"

[project.urls]
Repository = "https://github.com/Asthestarsfalll/excore"

[dependency-groups]
dev = [
  "pre-commit ==3.5",
  "black ==24.8",
  "ruff >=0.9.10,<0.10.0",
  "pytest >=7.4.4,<7.5.0",
  "pytest-cov >=4.1.0,<4.2.0",
  "torch ==1.13.1",
  "torchvision ==0.14.1",
  "mypy >=1.14.1,<1.15.0",
  "types-toml >=0.10.8.20240310,<0.11.0",
  "types-tqdm >=4.67.0.20241119,<4.68.0",
  "types-tabulate >=0.9.0.20240106,<0.10.0",
]

[[tool.uv.index]]
name = "torch"
url = "https://download.pytorch.org/whl/cu117"
explicit = true

[tool.uv.sources]
torch = { index = "torch" }
torchvision = { index = "torch" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 100
